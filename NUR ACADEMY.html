/* ===== quiz ===== */
function items(n){let r=[];
if(n==1)r=pick(L.map((_,i)=>i),10).map(i=>({ar:L[i][0],k:'L'+i,set:pick(L.map((_,j)=>j).filter(j=>j!=i),3).map(j=>'L'+j)}));
else if(n==3)r=pick([...'عحءقنرفبماطخ'],10).map(c=>({ar:c,k:area(c),set:['throat','tongue','lips','jawf']}));
else if(n==7)r=X7.map(x=>({...x}));
else C[n].forEach(c=>c[2].forEach(e=>r.push({ar:strip(e),k:c[0],set:KT[n]})));
return sh(r).map(x=>({...x,q:x.q||QT[n]}))}
function startQ(n,rep){const u=me(),it=rep?pick(u.wrong,10):items(n);if(!it.length)return toast(tx('Ошибок для повторения нет|Кайталоо үчүн ката жок|No mistakes to review'));Q={n,it,i:0,s:0,a:null,rep:!!rep,fin:0};go('quiz')}
F.quiz=()=>{const z=Q,u=me();if(z.i>=z.it.length)return fin();const it=z.it[z.i];if(!it.o)it.o=sh([it.k,...pick(it.set.filter(x=>x!=it.k),3)]);
const ok=z.a!==null&&it.o[z.a]===it.k;
return `<div class="row"><b>${z.i+1} / ${z.it.length}</b><span class="tag">${tx('Баллы|Упай|Points')}: ${z.s*10}</span></div><div class="bar"><i style="width:${z.i/z.it.length*100}%"></i></div>
<div class="card"><p class="mut">${tx(it.q)}</p><div class="ar ex" style="text-align:center;font-size:2.6rem">${it.ar}</div>
${it.o.map((o,j)=>`<button class="opt ${z.a!==null?(o==it.k?'ok':j==z.a?'bad':''):''}" ${z.a!==null?'disabled':''} onclick="ans(${j})">${label(o)}</button>`).join('')}
${z.a!==null?`<div class="note glow"><b>${ok?tx(OKM[z.i%3]):tx(BADM)}</b>${ok?'':`<br>${tx('Правильный ответ|Туура жооп|Correct answer')}: <b>${label(it.k)}</b>`}${NT[it.k]?`<br>${tx(NT[it.k])}`:''}</div><button onclick="Q.i++;Q.a=null;render()">${z.i+1<z.it.length?tx('Дальше|Кийинки|Next'):tx('Результат|Жыйынтык|Result')}</button>`:''}</div>`};
function ans(j){const z=Q,u=me(),it=z.it[z.i];if(z.a!==null)return;z.a=j;if(it.o[j]===it.k){z.s++;addPts(u,10);if(z.rep)u.wrong=u.wrong.filter(w=>!(w.ar==it.ar&&w.k==it.k))}else if(!u.wrong.some(w=>w.ar==it.ar&&w.k==it.k))u.wrong.push({ar:it.ar,k:it.k,set:it.set,q:it.q});save();render()}
function fin(){const z=Q,u=me(),p=Math.round(z.s/z.it.length*100),st=p>=90?3:p>=70?2:p>=50?1:0;let bonus='';
if(!z.fin){z.fin=1;if(!z.rep){u.best[z.n]=Math.max(u.best[z.n]||0,p);u.hist.unshift(tx(LV[z.n-1])+': '+p+'% ('+today()+')');if(p>=60&&!u.done.includes(z.n)){u.done.push(z.n);addPts(u,50);bonus=1}}if(p>=80||bonus)conf();save()}
return `<div class="card hero glow"><h2 style="color:#fff">${'⭐'.repeat(st)||'📖'} ${p}%</h2><p>${z.s*10} ${tx('баллов за тест|упай тест үчүн|points for this quiz')}${p>=60&&!z.rep?` · ${tx('уровень пройден (+50)|деңгээл өттү (+50)|level complete (+50)')}`:''}</p><button onclick="${z.rep?'startQ(0,1)':`startQ(${z.n})`}">${tx('Ещё раз|Кайра|Again')}</button> <button class="gh" onclick="go('home')">${tx('На главную|Башкы бетке|Home')}</button></div>`}

function wInit(){const c=$('#cv');if(!c)return;const x=c.getContext('2d');x.lineWidth=10;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#17302A';

${s.st=='checked'?`<p><b>${s.score} ${tx('баллов|упай|pts')}</b>${s.comment?': '+esc(s.comment):''}</p><button onclick="tset(${t.id},'done')">${tx('Завершить|Аяктоо|Complete')}</button>`:''}</div>`}).join(''):`<div class="card">${tx('Пока нет заданий. Когда преподаватель опубликует задание, оно появится здесь.|Азырынча тапшырма жок. Окутуучу жарыялаганда ушул жерде чыгат.|No tasks yet. They appear here when the teacher publishes one.')}</div>`)};

function tsend(id){const u=me(),s=u.tasks[id];s.ans=$('#a'+id).value;s.st='sent';save();toast(tx('Отправлено на проверку|Текшерүүгө жөнөтүлдү|Submitted'));render()}
/* ===== achievements ===== */
F.ach=()=>{const u=me(),B=[['🌱','Первая буква|Биринчи тамга|First letter',u.learned.length>=1],['📖','Весь алфавит|Бүт алфавит|Full alphabet',u.learned.length>=28],['⭐','100 баллов|100 упай|100 points',u.pts>=100],['🔥','Серия 3 дня|3 күндүк серия|3-day streak',u.streak>=3],['🏅','Уровень 1|1-деңгээл|Level 1',u.done.includes(1)],['✍️','Письмо: 5 букв|Жазуу: 5 тамга|Writing: 5 letters',u.written.length>=5],['🕌','Все уровни|Бардык деңгээл|All levels',u.done.length>=7]];
return `<h2>${tx('Мои достижения|Менин жетишкендиктерим|My achievements')}</h2><div class="gr">${B.map(b=>`<div class="card badge ${b[2]?'on':''}" style="text-align:center"><div style="font-size:2.4rem">${b[0]}</div>${tx(b[1])}</div>`).join('')}</div>
<p><button class="gh" onclick="startQ(0,1)">${tx('Повторить ошибки|Каталарды кайталоо|Review mistakes')} (${u.wrong.length})</button></p><h3>${tx('История обучения|Окуу тарыхы|Learning history')}</h3>${u.hist.slice(0,8).map(h=>`<div class="card" style="padding:8px 14px">${esc(h)}</div>`).join('')||`<p class="mut">—</p>`}
<p class="mut">${tx('Сертификаты и календарь занятий появятся на следующем этапе.|Сертификаттар жана сабак календары кийинки этапта кошулат.|Certificates and the lesson calendar come in the next stage.')}</p>`};
/* ===== teacher panel ===== */
F.teacher=()=>{const us=Object.values(S.users).sort((a,b)=>T.s=='lvl'?b.done.length-a.done.length||b.pts-a.pts:b.pts-a.pts);R=[];
let rv='';S.tasks.forEach(t=>us.forEach(u=>{const s=u.tasks[t.id];if(s&&s.st=='sent'){const r=R.push({u:u.id,t:t.id})-1;rv+=`<div class="card"><b>${esc(u.name)}</b> — ${esc(t.title)}<p>${esc(s.ans||'')}</p><input id="cm${r}" placeholder="${tx('Комментарий|Комментарий|Comment')}"><input id="sc${r}" type="number" placeholder="${tx('Баллы|Упай|Points')}" style="margin:6px 0"><button onclick="chk(${r})">${tx('Проверено|Текшерилди|Mark checked')}</button></div>`}}));
return `<h2>${tx('Кабинет преподавателя|Окутуучунун кабинети|Teacher panel')}</h2><div class="note">${tx('Данные хранятся только в этом браузере, входа и защиты пока нет. Общую базу, роли Student/Admin и защиту (Supabase + RLS) нужно подключить на следующем этапе.|Маалымат ушул браузерде гана сакталат, кирүү жана коргоо азырынча жок. Жалпы база, Student/Admin ролдору жана коргоо (Supabase + RLS) кийинки этапта кошулат.|Data lives only in this browser; there is no login or protection yet. A shared database, Student/Admin roles and security (Supabase + RLS) come in the next stage.')}</div>
<div class="card" style="overflow-x:auto"><table><tr><th>#</th><th>${tx('Имя ученика|Окуучу|Student')}</th><th onclick="T.s='lvl';render()">${tx('Уровень|Деңгээл|Level')}</th><th onclick="T.s='pts';render()">${tx('Баллы|Упай|Points')}</th><th>${tx('Прогресс|Прогресс|Progress')}</th><th>${tx('Тесты|Тесттер|Tests')}</th><th>${tx('Статус|Статус|Status')}</th></tr>
${us.map((u,i)=>{const d=(Date.now()-(u.visit||0))/864e5;return `<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>L${Math.min(7,u.done.length+1)}</td><td>${u.pts}</td><td>${Math.round(u.done.length/7*100)}%</td><td>${Object.entries(u.best).map(([k,v])=>'L'+k+':'+v+'%').join(' ')||'—'}</td><td>${d>=3?tx('Отстаёт (3+ дн.)|Артта (3+ күн)|Inactive (3+ days)'):tx('Активен|Активдүү|Active')}</td></tr>`}).join('')||`<tr><td colspan=7>${tx('Учеников пока нет|Окуучулар жок|No students yet')}</td></tr>`}</table></div>
<h3>${tx('Новое задание|Жаңы тапшырма|New task')}</h3><div class="card"><input id="tt" placeholder="${tx('Название|Аталышы|Title')}"><textarea id="td" rows="2" placeholder="${tx('Описание|Сүрөттөмө|Description')}" style="margin:6px 0"></textarea><div class="row"><select id="tl" style="flex:1">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}">${n}. ${tx(LV[n-1])}</option>`)}</select><select id="tg" style="flex:1"><option value="all">${tx('Вся группа|Бардык топ|Whole group')}</option>${us.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`)}</select><input id="tu" type="date" style="flex:1"></div><p><button onclick="addT()">${tx('Опубликовать|Жарыялоо|Publish')}</button></p></div>
<h3>${tx('На проверку|Текшерүүгө|To review')}</h3>${rv||`<p class="mut">—</p>`}<p><button class="gh" onclick="go('home')">←</button></p>`};
function addT(){const t=$('#tt').value.trim();if(!t)return toast(tx('Введите название|Аталышын жазыңыз|Enter a title'));S.tasks.push({id:Date.now(),title:t,desc:$('#td').value,level:+$('#tl').value,target:$('#tg').value,due:$('#tu').value});save();render()}
function chk(r){const q=R[r],s=S.users[q.u].tasks[q.t];s.st='checked';s.comment=$('#cm'+r).value;s.score=+$('#sc'+r).value||0;addPts(S.users[q.u],s.score);save();render()}
/* ===== shell ===== */
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08}):null;
function render(){document.documentElement.lang=S.lang;
$('#hd').innerHTML=`<b onclick="go('home')">NUR <i>ACADEMY</i></b><div class="lg">${[['ky','🇰🇬 KY'],['ru','🇷🇺 RU'],['en','🇬🇧 EN']].map(([c,n])=>`<button class="${S.lang==c?'on':''}" onclick="setL('${c}')">${n}</button>`).join('')}</div>`;
const items=[['home','Главная|Башкы бет|Home'],['alpha','Алфавит|Алфавит|Alphabet'],['write','Письмо|Жазуу|Writing'],['tasks','Задания|Тапшырмалар|Tasks'],['ach','Награды|Жетишкендиктер|Awards'],['teacher','Преподаватель|Окутуучу|Teacher']];
$('#nv').style.display=S.cur?'flex':'none';
$('#nv').innerHTML=items.map(x=>`<button class="${V.n==x[0]?'on':''}" onclick="go('${x[0]}')">${tx(x[1])}</button>`).join('')+`<button class="gh" onclick="logout()">${tx('Выход|Чыгуу|Log out')}</button>`;
const v=(!S.cur&&V.n!=='teacher')?'welcome':V.n;$('#app').innerHTML=F[v]();
if(v=='write')wInit();document.querySelectorAll('.rv').forEach(e=>io?io.observe(e):e.classList.add('in'))}
if('speechSynthesis' in window)speechSynthesis.getVoices();
render();
</script>
</body>
</html>
